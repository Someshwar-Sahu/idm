name: Build All Platforms (Windows, Linux, macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. WINDOWS: Build IDMan.exe & Standalone Inno Setup Installer
  # ============================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2 (MinGW)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          modules: 'qtnetworkauth'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Configure CMake
        shell: pwsh
        run: |
          $mingw = Get-ChildItem -Path "$env:RUNNER_WORKSPACE" -Recurse -Filter "g++.exe" | Where-Object { $_.FullName -like "*mingw1310_64*" } | Select-Object -First 1
          $mingwBin = if ($mingw) { $mingw.DirectoryName } else { "$env:RUNNER_WORKSPACE\Qt\Tools\mingw1310_64\bin" }
          Write-Host "Selected MinGW Toolchain: $mingwBin"
          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $qt = Get-ChildItem -Path "$env:RUNNER_WORKSPACE" -Recurse -Filter "windeployqt.exe" | Select-Object -First 1
          $qtBin = if ($qt) { $qt.DirectoryName } else { "$env:RUNNER_WORKSPACE\Qt\6.7.2\mingw_64\bin" }
          "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $qtRoot = Split-Path $qtBin -Parent
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$mingwBin\gcc.exe" `
            -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe" `
            -DCMAKE_PREFIX_PATH="$qtRoot" `
            -DQT_NO_PACKAGE_VERSION_CHECK=TRUE

      - name: Build IDMan
        run: cmake --build build --target idm_app --config Release -j4

      - name: Run Package Script
        shell: pwsh
        run: |
          $mingw = Get-ChildItem -Path "$env:RUNNER_WORKSPACE" -Recurse -Filter "g++.exe" | Where-Object { $_.FullName -like "*mingw1310_64*" } | Select-Object -First 1
          $env:MinGWBin = if ($mingw) { $mingw.DirectoryName } else { "$env:RUNNER_WORKSPACE\Qt\Tools\mingw1310_64\bin" }
          $qt = Get-ChildItem -Path "$env:RUNNER_WORKSPACE" -Recurse -Filter "windeployqt.exe" | Select-Object -First 1
          $env:QtBin = if ($qt) { $qt.DirectoryName } else { "$env:RUNNER_WORKSPACE\Qt\6.7.2\mingw_64\bin" }
          .\package.ps1

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: IDMan_Windows_Setup_v6.42
          path: installer_output/IDMan_Setup_v6.42.exe

  # ============================================================================
  # 2. LINUX: Build Native Linux Binary & Debian (.deb) Package
  # ============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6svg6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libcurl4-openssl-dev \
            libssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build IDMan
        run: cmake --build build --target idm_app -j$(nproc)

      - name: Package Debian (.deb) & Archive (.tar.gz)
        run: |
          cd build
          cpack -G "DEB;TGZ"

      - name: Upload Linux Packages (.deb / .tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: IDMan_Linux_Packages
          path: build/idman-*.*

  # ============================================================================
  # 3. macOS: Build Native macOS App Bundle & Disk Image (.dmg)
  # ============================================================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.7.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'clang_64'

      - name: Install Ninja
        run: brew install ninja

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build IDMan.app
        run: cmake --build build --target idm_app -j$(sysctl -n hw.ncpu)

      - name: Deploy macOS App & Create .dmg
        run: |
          export PATH="$Qt6_DIR/bin:$PATH"
          macdeployqt build/IDMan.app -dmg
          mv build/IDMan.dmg build/IDMan_macOS_v6.42.dmg

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: IDMan_macOS_v6.42
          path: build/IDMan_macOS_v6.42.dmg

  # ============================================================================
  # 4. RELEASE: Automatically Publish GitHub Release on tag push (v*)
  # ============================================================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IDM Native C++ Accelerator ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/IDMan_Windows_Setup_v6.42/IDMan_Setup_v6.42.exe
            artifacts/IDMan_Linux_Packages/*.deb
            artifacts/IDMan_Linux_Packages/*.tar.gz
            artifacts/IDMan_macOS_v6.42/IDMan_macOS_v6.42.dmg

